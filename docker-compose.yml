version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: webrtc_recorder_db
    environment:
      POSTGRES_USER: webrtc_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: webrtc_recorder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U webrtc_user -d webrtc_recorder" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webrtc_recorder_server
    environment:
      NODE_ENV: development
      PORT: 3000
      WS_PORT: 8080
      DATABASE_URL: postgresql://webrtc_user:secure_password@postgres:5432/webrtc_recorder
      JWT_SECRET: dev-secret-key-change-in-production-12345678
      MTLS_ENABLED: "true"
    ports:
      - "3000:3000"
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./certs:/app/certs
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: webrtc_recorder_web
    ports:
      - "8081:80"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
    restart: unless-stopped

  load-tester:
    image: grafana/k6:latest
    container_name: webrtc_recorder_load_tester
    volumes:
      - ./tests/load:/scripts
    environment:
      - BASE_URL=http://server:3000
    networks:
      - default
    depends_on:
      - server
    command: run /scripts/load-test-main.js

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: webrtc_recorder_net
