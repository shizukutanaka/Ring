version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: webrtc-db
    environment:
      POSTGRES_DB: webrtc_recorder
      POSTGRES_USER: webrtc
      POSTGRES_PASSWORD: dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webrtc"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc-network

  server:
    build: ./server
    container_name: webrtc-server
    environment:
      DATABASE_URL: postgresql://webrtc:dev-password@postgres:5432/webrtc_recorder
      JWT_SECRET: dev-secret-key-minimum-32-characters-long
      NODE_ENV: development
      DEBUG: webrtc:*
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
    networks:
      - webrtc-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: webrtc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - server
    networks:
      - webrtc-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: webrtc-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - webrtc-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: webrtc-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - webrtc-network
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: webrtc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webrtc-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: webrtc-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - webrtc-network
    restart: unless-stopped

  # Optional: Adminer for quick database inspection
  adminer:
    image: adminer:latest
    container_name: webrtc-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - webrtc-network
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

networks:
  webrtc-network:
    driver: bridge
